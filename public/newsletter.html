<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newsletter — GTA6 Guide</title>
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0b0d17;color:#e8e9f3;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{text-align:center;max-width:440px;padding:40px 24px}
.box h1{font-size:1.6rem;margin-bottom:12px}
.box p{color:#8b8fa8;margin-bottom:24px;font-size:.95rem}
.input-row{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;padding:12px 14px;border:1px solid #1e2244;border-radius:8px;background:#13162a;color:#fff;font-size:.95rem;outline:none}
input:focus{border-color:#e74c3c}
button{padding:12px 20px;background:#e74c3c;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem}
button:hover{opacity:.9}
a{color:#8b8fa8;font-size:.85rem;text-decoration:none;display:inline-block;margin-top:12px}
a:hover{color:#fff}
</style>
</head>
<body>
<div class="box">
  <h1>🎮 GTA6 Guide — Newsletter</h1>
  <p>Le nuove guide direttamente nella tua casella. Nessuno spam, solo contenuti.</p>
  <form action="https://formspree.io/f/TUO-FORM-ID" method="POST">
    <div class="input-row">
      <input type="email" name="email" placeholder="la-tua-email@email.com" required>
      <button type="submit">Iscriviti</button>
    </div>
  </form>
  <a href="/">← Torna alla homepage</a>
</div>
</body>
</html>
