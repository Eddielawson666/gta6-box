<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA 6 Index — Confirmed Facts, Leaks & Guides</title>
  <meta name="description" content="GTA VI news, confirmed features, PC specs, map breakdowns and guides. Updated weekly. No fluff, no fake leaks.">
  <link rel="canonical" href="https://gta6-index.com/">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9593748009949134" crossorigin="anonymous"></script>
  <style>
    :root { --bg:#0f0f0f; --card:#1a1a1a; --accent:#ff3c1f; --text:#e0e0e0; --muted:#888; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .container { max-width:960px; margin:0 auto; padding:2rem 1rem; }
    header { text-align:center; padding:3rem 1rem 2rem; }
    header h1 { font-size:2.4rem; margin-bottom:.5rem; }
    header p { color:var(--muted); max-width:520px; margin:0 auto; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; margin-top:2rem; }
    .card { background:var(--card); border-radius:10px; padding:1.2rem; transition:transform .15s; }
    .card:hover { transform:translateY(-3px); }
    .card h3 { font-size:1.05rem; margin-bottom:.4rem; }
    .card h3 a { color:var(--text); }
    .card p { font-size:.85rem; color:var(--muted); }
    .newsletter { margin-top:3rem; text-align:center; background:var(--card); border-radius:10px; padding:2rem 1.5rem; }
    .newsletter a { display:inline-block; margin-top:.8rem; background:var(--accent); color:#fff; padding:.6rem 1.4rem; border-radius:6px; font-weight:600; }
    footer { text-align:center; padding:2rem 1rem; color:var(--muted); font-size:.8rem; }
    .all-link { text-align:center; margin-bottom:1.5rem; }
    .all-link a { color:var(--muted); font-size:.9rem; font-weight:600; }
  </style>
</head>
<body>
  <header>
    <h1>GTA 6 Index</h1>
    <p>Confirmed facts. Real specs. No recycled junk. Updated every Monday.</p>
  </header>
  <div class="container">
    <div class="all-link">
      <a href="/all-articles.html">Browse all articles →</a>
    </div>
    <div class="grid" id="articles-grid"></div>
    <div class="newsletter">
      <h2>Don't miss a single update</h2>
      <p style="color:var(--muted);margin-top:.4rem">One email per week. Unsubscribe whenever.</p>
      <a href="/newsletter.html">Join the list</a>
    </div>
  </div>
  <footer>
    <p>gta6-index.com · Not affiliated with Rockstar Games or Take-Two Interactive.</p>
  </footer>
  <script>
    fetch('/sitemap.xml')
      .then(r => r.text())
      .then(xml => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'text/xml');
        const locs = doc.getElementsByTagName('loc');
        const urls = Array.from(locs).map(l => l.textContent).filter(u => u.includes('/articles/'));
        const grid = document.getElementById('articles-grid');
        urls.slice(0, 15).forEach(url => {
          const slug = url.split('/articles/')[1].replace('.html','');
          const title = slug.replace(/-/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<h3><a href="/articles/' + slug + '.html">' + title + '</a></h3><p>GTA VI · Updated weekly</p>';
          grid.appendChild(card);
        });
      })
      .catch(e => console.log('Sitemap fetch error:', e));
  </script>
</body>
</html>
