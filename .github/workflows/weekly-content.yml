name: Weekly Content

on:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'generator.py'
      - '.github/workflows/weekly-content.yml'
  workflow_dispatch:
    inputs:
      generate_articles:
        description: 'Generate new articles (uses OpenAI credits)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gta6-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_articles)
        with:
          python-version: '3.11'

      - name: Install OpenAI SDK
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_articles)
        run: python -m pip install openai

      - name: Generate articles
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_articles)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AMAZON_STORE: www.amazon.it
          AMAZON_TAG: gta6index-21
        run: python generator.py --niche gta6 --count 15 --output ./docs/articles --domain gta6-index.com

      - name: Commit and push generated content
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_articles)
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -- docs/index.html docs/all-articles.html docs/sitemap.xml 'docs/articles/*.html' docs/articles/.keywords_done
          if ! git diff --cached --quiet; then
            git commit -m 'auto: weekly content update'
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir -p _site
          rsync -a --exclude='articles-it/' --exclude='.keywords_done' docs/ _site/
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/ads.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
