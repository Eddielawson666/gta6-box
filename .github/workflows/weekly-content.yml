name: GTA6 Weekly Content
on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install openai

      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python generator.py --niche gta6 --count 15 --output ./public/articles --domain gta6-index.com

      - name: Commit and push
        run: |
          git config user.name "gta6-bot"
          git config user.email "bot@gta6-index.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: nuovi articoli"
          git push
