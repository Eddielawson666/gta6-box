name: Weekly Content

on:
  schedule:
    - cron: "0 7 * * 1"
    - cron: "0 7 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install openai

      - name: Generate articles
        run: python generator.py --niche gta6 --count 15 --output ./docs/articles --domain gta6-index.com
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: weekly content update"
          git push
